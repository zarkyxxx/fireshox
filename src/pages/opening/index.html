<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shox Opening</title>
<link rel="icon" href="/assets/logo-32.png">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="style.css">
<script>/* erreurs gardées pour les tests (outil --run) */ window.__errs = []; addEventListener('error', (e) => __errs.push(e.message + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno)); addEventListener('unhandledrejection', (e) => __errs.push('promesse : ' + (e.reason && e.reason.message || e.reason)));</script>
</head>
<body>
<!-- Icônes et dégradés partagés -->
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b0"/><stop offset=".48" stop-color="#ffb000"/><stop offset="1" stop-color="#b85c00"/></linearGradient>
    <linearGradient id="g-coin-in" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe17a"/><stop offset="1" stop-color="#d27a00"/></linearGradient>
    <radialGradient id="g-hood" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ff7aa8"/><stop offset=".55" stop-color="#ff2f7d"/><stop offset="1" stop-color="#8a0d3d"/></radialGradient>
    <radialGradient id="g-mask" cx="38%" cy="28%" r="85%"><stop offset="0" stop-color="#3a3a42"/><stop offset=".5" stop-color="#121216"/><stop offset="1" stop-color="#000"/></radialGradient>
  </defs>
  <symbol id="i-coin" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="15" fill="url(#g-coin)"/>
    <circle cx="16" cy="16" r="11.2" fill="url(#g-coin-in)" stroke="#8a4b00" stroke-opacity=".55" stroke-width="1.4"/>
    <path d="M20.2 11.6c-.9-1.2-2.4-1.9-4.2-1.9-2.5 0-4.2 1.3-4.2 3.2 0 4.1 7.6 2.6 7.6 5.9 0 1.2-1.3 2-3.3 2-1.9 0-3.4-.8-4.3-2.1" fill="none" stroke="#7a3d00" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M16 7.6v2.1M16 22.3v2.1" stroke="#7a3d00" stroke-width="2" stroke-linecap="round"/>
    <path d="M7 11a10 10 0 0 1 6-4.6" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-shox" viewBox="0 0 64 40">
    <path d="M5 26c0-6 1.5-12 4.5-16 1-1.3 2.6-1.5 3.8-.6 3 2.4 7.4 2.3 10.3-.6l1.6-1.6c1-1 2.6-1 3.5 0 4.6 4.8 10.6 8 17.4 9.5 5.6 1.2 9.9 3.7 11.6 7.3.5 1 .3 2-.6 2H5z" fill="currentColor"/>
    <path d="M27 13l4 2.6M30 10.4l4 2.6M33.5 8l4 2.6" stroke="#000" stroke-opacity=".35" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="4" y="27.5" width="56" height="3.6" rx="1.8" fill="currentColor" opacity=".75"/>
    <g fill="currentColor" opacity=".9"><rect x="6" y="32" width="5" height="6.5" rx="1.6"/><rect x="13" y="32" width="5" height="6.5" rx="1.6"/><rect x="20" y="32" width="5" height="6.5" rx="1.6"/><rect x="27" y="32" width="5" height="6.5" rx="1.6"/></g>
    <path d="M35 32h24l-1.6 4.2c-.4 1-1.3 1.6-2.3 1.6H37c-1.1 0-2-.9-2-2z" fill="currentColor" opacity=".9"/>
  </symbol>
  <symbol id="i-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="13" height="17" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h9"/></symbol>
  <symbol id="i-recycle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.8a1.8 1.8 0 0 1-1.6-2.7l3.9-6.7"/><path d="M11 19h8.2a1.8 1.8 0 0 0 1.6-2.7l-1.2-2.1"/><path d="m14 16-3 3 3 3"/><path d="M8.3 13.6 7.2 9.5 3.1 10.6"/><path d="m9.3 5.6 1.1-1.9a1.8 1.8 0 0 1 3.1 0l3.9 6.7"/><path d="m13.4 9.5 4-1.1 1.1 4.1"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-skip" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.5v13a1 1 0 0 0 1.5.9L15 13.2V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v4.8L5.5 4.6A1 1 0 0 0 4 5.5z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8z"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM14 20h1M20 14h1" /></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 14h7l-1.5 8L20 10h-7z"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
</svg>

<canvas id="fx-page" class="fx-page"></canvas>

<header class="top">
  <a class="brand" href="#boutique" aria-label="Shox Opening">
    <span class="brand-logo"><span class="brand-ring"></span><img src="/assets/logo-64.png" alt=""></span>
    <span class="brand-txt"><b>Shox</b><b class="fire-text">Opening</b></span>
  </a>
  <nav class="tabs" role="tablist">
    <button class="tab" data-view="boutique" role="tab"><svg><use href="#i-bag"/></svg><span>Boutique</span></button>
    <button class="tab" data-view="collection" role="tab"><svg><use href="#i-cards"/></svg><span>Collection</span><em id="tab-count">0/36</em></button>
    <span class="tab-ink"></span>
  </nav>
  <div class="top-right">
    <button class="daily-btn" id="daily-btn" title="Bonus quotidien"><svg><use href="#i-gift"/></svg><span id="daily-lbl">Bonus</span><i class="dot"></i></button>
    <div class="coins" id="coins" title="Tes ShoxCoins">
      <svg class="coin-ico"><use href="#i-coin"/></svg>
      <b id="coins-val">1 000</b><span class="coins-unit">ShoxCoins</span>
    </div>
  </div>
</header>

<main>
  <!-- ======================= BOUTIQUE ======================= -->
  <section class="view" id="view-boutique">
    <div class="shop-head">
      <div>
        <h1 class="h1">Choisis ton <span class="fire-text">booster</span></h1>
        <p class="lead">8 cartes par paquet, dont une carte jeu. Les <b class="t-legend">Légendaires</b> sortent dans 5 % des cas.</p>
      </div>
      <div class="daily-card fs-panel" id="daily-card">
        <div class="dc-ico"><svg><use href="#i-gift"/></svg></div>
        <div class="dc-txt"><b id="dc-title">Bonus quotidien</b><span id="dc-sub">+250 ShoxCoins</span></div>
        <button class="fs-btn fire" id="dc-btn">Récupérer</button>
      </div>
    </div>
    <div class="shop-grid" id="shop-grid"></div>
    <div class="earn">
      <h2 class="h2">Plus de ShoxCoins ?</h2>
      <div class="earn-grid">
        <div class="earn-item"><svg><use href="#i-gift"/></svg><div><b>Bonus quotidien</b><span>Reviens chaque jour : la série augmente le bonus jusqu'à 500.</span></div></div>
        <button class="earn-item" id="earn-recycle"><svg><use href="#i-recycle"/></svg><div><b>Recycle tes doublons</b><span id="earn-recycle-sub">De 5 à 200 ShoxCoins la carte selon la rareté.</span></div></button>
        <button class="earn-item" id="earn-bench"><svg><use href="#i-bolt"/></svg><div><b>Lance un ShoxBench</b><span>+15 ShoxCoins à chaque test de vitesse.</span></div></button>
      </div>
    </div>
  </section>

  <!-- ======================= COLLECTION ======================= -->
  <section class="view" id="view-collection" hidden>
    <div class="col-head">
      <div>
        <h1 class="h1">Ta <span class="fire-text">collection</span></h1>
        <p class="lead" id="col-lead"></p>
      </div>
      <div class="col-stats" id="col-stats"></div>
    </div>
    <div class="col-progress" id="col-progress"></div>
    <div class="col-tools">
      <div class="chips" id="col-chips"></div>
      <div class="col-tools-r">
        <label class="switch"><input type="checkbox" id="col-missing"><span class="sw"></span><span>Cartes manquantes</span></label>
        <button class="fs-btn recycle-btn" id="col-recycle"><svg><use href="#i-recycle"/></svg><span>Recycler les doublons</span></button>
      </div>
    </div>
    <div id="col-grid" class="col-grid"></div>
  </section>
</main>

<!-- ======================= OUVERTURE ======================= -->
<div class="stage" id="stage" hidden>
  <div class="st-bg"></div>
  <div class="st-dark"></div>
  <div class="st-rays"><canvas class="st-rays-in" width="720" height="720"></canvas></div>
  <div class="st-marquee" id="st-marquee"></div>
  <canvas id="fx-back" class="fx-layer"></canvas>
  <div class="st-shake" id="st-shake">
    <div class="st-center" id="st-center"></div>
  </div>
  <canvas id="fx-front" class="fx-layer"></canvas>
  <div class="st-label" id="st-label"></div>
  <div class="st-name" id="st-name"></div>
  <div class="st-top">
    <div class="st-title"><span class="st-bname" id="st-bname"></span><span class="st-count" id="st-count"></span></div>
    <button class="st-skip" id="st-skip"><span>Tout révéler</span><svg><use href="#i-skip"/></svg></button>
  </div>
  <div class="st-hint" id="st-hint"></div>
  <div class="st-tray" id="st-tray"></div>
  <div class="st-recap" id="st-recap" hidden></div>
  <div class="st-flash" id="st-flash"></div>
</div>

<!-- ======================= VUE DÉTAILLÉE ======================= -->
<div class="detail" id="detail" hidden>
  <div class="dt-backdrop"></div>
  <button class="dt-nav dt-prev" id="dt-prev" aria-label="Carte précédente"><svg><use href="#i-left"/></svg></button>
  <button class="dt-nav dt-next" id="dt-next" aria-label="Carte suivante"><svg><use href="#i-right"/></svg></button>
  <button class="dt-close" id="dt-close" aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
  <div class="dt-wrap">
    <div class="dt-stage" id="dt-stage"><div class="dt-glow" id="dt-glow"></div><div class="dt-tilt" id="dt-tilt"></div></div>
    <div class="dt-info" id="dt-info"></div>
  </div>
</div>

<!-- ======================= FENÊTRE (recyclage…) ======================= -->
<div class="modal" id="modal" hidden>
  <div class="md-backdrop"></div>
  <div class="md-box fs-panel" id="md-box"></div>
</div>

<script src="/shared/fx.js"></script>
<script src="data.js"></script>
<script src="qr.js"></script>
<script src="particles.js"></script>
<script src="cards.js"></script>
<script src="opening.js"></script>
<script src="app.js"></script>
</body>
</html>
