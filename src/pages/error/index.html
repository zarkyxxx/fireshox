<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Page introuvable</title>
<link rel="icon" href="/assets/logo-32.png">
<link rel="stylesheet" href="/shared/base.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; overflow: hidden;
    background: radial-gradient(60% 50% at 50% 40%, rgba(255,90,0,.14), transparent 70%), var(--bg); }
  main { text-align: center; max-width: 560px; padding: 24px; }
  .shoe { font-size: 74px; display: inline-block; animation: wobble 2.4s ease-in-out infinite; filter: drop-shadow(0 10px 30px rgba(255,90,0,.5)); }
  @keyframes wobble { 0%,100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(8deg) translateY(-10px); } }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 44px; margin: 10px 0 6px; letter-spacing: .02em; }
  p { color: var(--text-2); margin: 0 0 6px; }
  code { font-family: var(--font-mono); color: var(--fire-3); font-size: 13px; word-break: break-all; }
  .actions { margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <div class="shoe">👟</div>
  <h1 class="fire-text" id="title">Shox perdue</h1>
  <p id="msg">Cette page a pris trop d'amorti et a rebondi hors de la carte.</p>
  <p><code id="detail"></code></p>
  <div class="actions">
    <button class="fs-btn fire" id="retry">Réessayer</button>
    <button class="fs-btn" id="home">Accueil Fire Shox</button>
  </div>
</main>
<script src="/shared/fx.js"></script>
<script>
  // Utilisée pour les adresses internes inconnues ET pour les erreurs réseau :
  // fireshox://error/?url=…&code=…&desc=…
  const q = new URLSearchParams(location.search);
  const url = q.get('url'); const code = q.get('code'); const desc = q.get('desc') || '';
  const NET = {
    '-105': ['Adresse introuvable', "Le serveur n'existe pas (ou il est parti s'acheter des Shox)."],
    '-106': ['Pas de connexion', "Internet est débranché. Même le Turbo Shox ne peut rien pour toi."],
    '-102': ['Connexion refusée', 'Le site a refusé de rebondir.'],
    '-118': ['Trop lent', 'Le site met plus de temps à répondre qu\'un ressort rouillé.'],
    '-137': ['Adresse introuvable', "Le nom de domaine n'a pas pu être résolu."],
    '-200': ['Connexion non sécurisée', 'Le certificat de ce site est invalide. ShoxGuard a bloqué la page.'],
    '-201': ['Horloge déréglée', 'La date de ton ordinateur ne correspond pas au certificat du site.'],
    '-202': ['Connexion non sécurisée', "Le certificat n'est pas reconnu. ShoxGuard a bloqué la page."],
  };
  if (code) {
    const [t, m] = NET[code] || ['Chargement impossible', 'La page a fait un faux rebond.'];
    document.getElementById('title').textContent = t;
    document.getElementById('msg').textContent = m;
    document.title = t;
  }
  document.getElementById('detail').textContent = [url, desc && `(${desc})`].filter(Boolean).join(' ') || location.href;
  document.getElementById('retry').onclick = () => { if (url) location.replace(url); else location.reload(); };
  document.getElementById('home').onclick = () => location.replace('fireshox://home/');
</script>
</body>
</html>
