<div id="app">
  <!-- Bande des onglets (sert aussi de barre de titre) -->
  <header id="tabstrip">
    <div class="brand" title="Fire Shox">
      <img src="../../assets/logo-64.png" alt="" id="brand-logo">
      <span class="brand-name">FIRE SHOX</span>
    </div>
    <div id="tabs" role="tablist"><button class="strip-btn" id="newtab" title="Nouvel onglet (Ctrl+T)"><svg class="ic"><use href="#i-plus"/></svg></button></div>
  </header>

  <!-- Barre d'outils -->
  <nav id="toolbar">
    <button class="tb" id="b-back" title="Page précédente (Alt+←)"><svg class="ic"><use href="#i-back"/></svg></button>
    <button class="tb" id="b-forward" title="Page suivante (Alt+→)"><svg class="ic"><use href="#i-forward"/></svg></button>
    <button class="tb" id="b-reload" title="Actualiser (F5)"><svg class="ic"><use href="#i-reload"/></svg></button>
    <button class="tb" id="b-home" title="Accueil Fire Shox (Alt+Début)"><svg class="ic"><use href="#i-home"/></svg></button>

    <div id="omnibox">
      <button id="guard" class="guard" title="ShoxGuard"><svg class="ic"><use href="#i-flame"/></svg><span>ShoxGuard</span></button>
      <span class="omni-sep"></span>
      <input id="address" spellcheck="false" autocomplete="off" placeholder="Rechercher sur le Web ou taper une Shox-Requête…">
      <button id="zoom-badge" class="omni-chip" hidden title="Réinitialiser le zoom">100 %</button>
      <button id="b-star" class="omni-icon" title="Ajouter aux favoris (Ctrl+D)"><svg class="ic"><use href="#i-star"/></svg></button>
      <button id="b-turbo" class="turbo-btn" title="Mode Turbo Shox"><svg class="ic"><use href="#i-zap"/></svg>TURBO</button>
      <div id="suggest" hidden></div>
    </div>

    <button id="b-update" class="update-pill" hidden title="Une mise à jour est prête"><svg class="ic"><use href="#i-sparkle"/></svg><span>Mettre à jour</span></button>
    <button class="tb" id="b-apps" title="Sites Fire Shox"><svg class="ic"><use href="#i-grid"/></svg></button>
    <button class="tb" id="b-downloads" title="Téléchargements (Ctrl+J)"><svg class="ic"><use href="#i-download"/></svg><svg class="dl-ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5"/></svg></button>
    <button class="avatar" id="b-menu" title="Menu Fire Shox"><img src="../../assets/logo-64.png" alt=""></button>
    <div id="turbo-flames"></div>
  </nav>

  <!-- Barre de favoris -->
  <div id="bookmarks"></div>
  <div id="progress"><i></i></div>

  <!-- Contenu -->
  <main id="views">
    <div id="findbar" hidden>
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="find-input" spellcheck="false" placeholder="Rechercher dans la page">
      <span id="find-count"></span>
      <button class="tb sm" id="find-prev" title="Précédent"><svg class="ic"><use href="#i-up"/></svg></button>
      <button class="tb sm" id="find-next" title="Suivant"><svg class="ic"><use href="#i-down"/></svg></button>
      <button class="tb sm" id="find-close" title="Fermer (Échap)"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div id="status" hidden></div>
  </main>
</div>

<div id="layer"></div>
<script src="ui.js"></script>

</html>
